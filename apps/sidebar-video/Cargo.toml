[package]
name = "sidebar-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
validation-screenshot = ["eframe/__screenshot"]
capture-test = ["video-core/capture-test"]

[dependencies]
video-core.workspace = true
eframe = { version = "=0.33.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
tempfile = "3"
