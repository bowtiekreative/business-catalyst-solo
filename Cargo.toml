[workspace]
members = ["apps/desktop", "packages/core", "packages/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
catalyst-core = { path = "packages/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.dev]
debug = 1
