[package]
name = "video-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
capture-test = []

[dependencies]
base64 = "0.22"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2.5"
tempfile = "3"
tiny-skia = "0.11"
cosmic-text = { version = "0.14", default-features = false, features = ["std", "swash"] }
fontdb = { version = "0.16", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
catalyst-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ffmpeg-sidecar = { version = "=2.7.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
